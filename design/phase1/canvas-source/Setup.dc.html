<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rozzy shop setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5FF; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 22px; font-family: Inter, sans-serif; color: #14123A">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #7B2CF5">Step 1 of 1 · sirf pehli baar</span>
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.25">Apni dukaan ke baare mein bataein</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="shop" style="font-size: 14px; font-weight: 500; color: #4A4770">Dukaan ka naam</label>
<input id="shop" type="text" value="Ali General Store" style="height: 54px; border: 1px solid #D9D3F0; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: Inter, sans-serif; font-size: 17px; color: #14123A; outline: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="city" style="font-size: 14px; font-weight: 500; color: #4A4770">Shehar</label>
<input id="city" type="text" value="Lahore" style="height: 54px; border: 1px solid #D9D3F0; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: Inter, sans-serif; font-size: 17px; color: #14123A; outline: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 500; color: #4A4770">Aap kis zubaan mein bolte hain?</span>
<div style="display: flex; gap: 10px">
<button style="flex: 1; height: 52px; border-radius: 14px; border: 2px solid #7B2CF5; background: #F0E8FF; color: #4B12B8; font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px">Roman Urdu</button>
<button style="flex: 1; height: 52px; border-radius: 14px; border: 1px solid #D9D3F0; background: #FFFFFF; color: #14123A; font-family: Poppins, sans-serif; font-weight: 500; font-size: 15px">Punjabi</button>
</div>
<span style="font-size: 13px; color: #5E5B82">Dono zubaanen samajh aati hain. Ye sirf aap ki pehli pasand hai.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="foot" style="font-size: 14px; font-weight: 500; color: #4A4770">Bill ke neeche likhna hai (optional)</label>
<input id="foot" type="text" value="Shukriya, phir tashreef laayein" style="height: 54px; border: 1px solid #D9D3F0; border-radius: 14px; background: #FFFFFF; padding: 0 16px; font-family: Inter, sans-serif; font-size: 17px; color: #14123A; outline: 0">
</div>
<button style="margin-top: auto; height: 56px; border: 0; border-radius: 14px; background: #7B2CF5; color: #FFFFFF; font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px">Shuru karein</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>

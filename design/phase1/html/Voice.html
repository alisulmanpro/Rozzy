<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Rozzy voice assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(circle at 50% 38%, #EADFFF 0%, #F7F5FF 55%); display: flex; flex-direction: column; align-items: center; font-family: Inter, sans-serif; color: #14123A; position: relative; overflow: hidden">
<div style="align-self: stretch; padding: 52px 16px 0; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Band karein" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14123A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px">Rozzy AI</span>
<span style="font-size: 13px; font-weight: 600; color: #4B12B8; background: #F0E8FF; border-radius: 999px; padding: 6px 12px">Roman Urdu</span>
</div>
<span style="margin-top: 10px; font-size: 13px; color: #4A4770">Kabhi bhi kahein: "Hey Rozzy"</span>
<div style="position: relative; width: 340px; height: 340px; margin-top: 44px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; width: 340px; height: 340px; border-radius: 170px; border: 1.5px solid rgba(123,44,245,0.14)"></div>
<div style="position: absolute; width: 276px; height: 276px; border-radius: 138px; border: 1.5px solid rgba(123,44,245,0.22); background: rgba(123,44,245,0.05)"></div>
<div style="position: absolute; width: 216px; height: 216px; border-radius: 108px; background: rgba(232,30,200,0.10)"></div>
<div style="position: relative; width: 168px; height: 168px; border-radius: 84px; background: radial-gradient(circle at 24% 22%, #FFA13B 0%, rgba(255,161,59,0) 46%), radial-gradient(circle at 82% 30%, #F03E5A 0%, rgba(240,62,90,0) 50%), radial-gradient(circle at 30% 86%, #E81EC8 0%, rgba(232,30,200,0) 55%), #7B2CF5; box-shadow: 0 20px 50px rgba(123,44,245,0.38), inset 0 -10px 24px rgba(20,18,58,0.18), inset 0 8px 18px rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center" role="img" aria-label="Rozzy sun raha hai">
<div style="display: flex; align-items: center; gap: 6px; height: 72px">
<div style="width: 8px; height: 22px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 40px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 62px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 30px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 70px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 44px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 56px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 26px; border-radius: 4px; background: #FFFFFF"></div>
<div style="width: 8px; height: 38px; border-radius: 4px; background: #FFFFFF"></div>
</div>
</div>
</div>
<h1 style="margin: 12px 0 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 26px">Main sun raha hoon…</h1>
<div style="margin: 18px 24px 0; align-self: stretch; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E8E4F7; border-radius: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #5E5B82">Aap ne kaha</span>
<span style="font-size: 17px; line-height: 1.45; font-weight: 500">do kilo ata 40 rupay, ek kilo khand 150 rupay aur <span style="color: #6A1FE0">pachaas rupay ki ilachi</span></span>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 28px 36px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Likh kar bataein" style="width: 56px; height: 56px; border-radius: 28px; border: 1.5px solid #D9D3F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14123A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
<button aria-label="Bolna band karein" style="width: 76px; height: 76px; border-radius: 38px; border: 0; background: #14123A; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 26px rgba(20,18,58,0.3)"><div style="width: 24px; height: 24px; border-radius: 6px; background: #FFFFFF"></div></button>
<button aria-label="Madad" style="width: 56px; height: 56px; border-radius: 28px; border: 1.5px solid #D9D3F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px; color: #14123A">?</button>
</div>
</div>
</body>
</html>
